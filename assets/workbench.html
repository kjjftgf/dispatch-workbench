<!DOCTYPE html>
<html lang="zh-CN"><head>
<link rel="icon" href="data:,"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>配送运营工作台 · C2</title>
<style>
:root{
  --bg:#070b14; --bar:rgba(10,16,28,.86); --line:rgba(255,255,255,.10); --line2:rgba(255,255,255,.06);
  --ink:#eaf1ff; --ink2:#9aabc4; --ink3:#62718a;
  --cyan:#3ddcff; --violet:#7c5cff; --warn:#ff4d8d; --ok:#22d3a5;
  --bar-h:54px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;color:var(--ink);background:var(--bg);overflow:hidden;
  font:14px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;
  -webkit-font-smoothing:antialiased;
  background-image:
    radial-gradient(900px 520px at 4% -10%,rgba(61,220,255,.14),transparent 62%),
    radial-gradient(800px 500px at 96% -8%,rgba(124,92,255,.16),transparent 60%);}

.topbar{display:flex;align-items:center;gap:18px;height:auto;min-height:54px;flex-wrap:wrap;min-width:0;max-width:100%;padding:0 18px;
  border-bottom:1px solid var(--line);background:var(--bar);backdrop-filter:blur(16px)}
.brand{display:flex;align-items:baseline;gap:8px;font-weight:800;font-size:15px;letter-spacing:.3px;flex:none}
.brand span{font-size:10px;font-weight:600;letter-spacing:1.6px;color:var(--ink3)}
nav{display:flex;gap:6px;flex:none}
nav button{appearance:none;border:1px solid transparent;background:transparent;color:var(--ink2);
  font:inherit;font-size:13.5px;padding:6px 12px;border-radius:9px;cursor:pointer;transition:.15s}
nav button:hover{color:var(--ink);background:rgba(255,255,255,.05)}
nav button.on{color:#04121c;font-weight:700;border-color:transparent;
  background:linear-gradient(96deg,var(--cyan),var(--violet))}
nav button[disabled]{opacity:.4;cursor:not-allowed}
.subbar{display:flex;gap:7px;align-items:center;height:0;padding:0 18px;
  overflow:hidden;scrollbar-width:none;-webkit-overflow-scrolling:touch;
  border-bottom:1px solid transparent;transition:height .18s ease, padding .18s ease;
  background:rgba(10,16,28,.55);backdrop-filter:blur(12px)}
.subbar.open{height:44px;padding:0 18px;overflow-x:auto;overflow-y:hidden;border-bottom-color:var(--line)}
.subbar::-webkit-scrollbar{display:none}
.subbar>*{flex:none}
.subbar button{appearance:none;border:1px solid var(--line);background:rgba(255,255,255,.03);
  color:var(--ink2);font:inherit;font-size:12.5px;padding:5px 11px;border-radius:8px;cursor:pointer;white-space:nowrap}
.subbar button:hover{color:var(--ink);border-color:rgba(255,255,255,.22)}
.subbar button.on{color:var(--cyan);border-color:rgba(61,220,255,.45);background:rgba(61,220,255,.10);font-weight:600}
.spacer{flex:1}
.ctx{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink3);white-space:nowrap}
.ctx span{color:var(--ink2)}
.ctx i{font-style:normal;opacity:.5}
.shift-chip{font-size:12.5px;font-weight:700;color:var(--cyan);border:1px solid rgba(61,220,255,.38);
  background:rgba(61,220,255,.10);border-radius:8px;padding:4px 10px;white-space:nowrap}
.live{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:999px;
  padding:5px 12px;font-size:12.5px;color:var(--ink2);background:rgba(255,255,255,.03);flex:none}
.live .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 10px var(--ok)}
.stage{position:absolute;inset:var(--bar-h,54px) 0 0 0;display:flex;flex-direction:column;min-height:0}
body.sub-open .stage{inset:calc(var(--bar-h,54px) + 44px) 0 0 0}
iframe{flex:1;width:100%;border:0;background:transparent;display:block}
.tip{padding:26px;color:var(--ink2);font-size:14px}
/* ---- 预览链接（只读/限时/带水印） ---- */
.shbtn{appearance:none;border:1px solid rgba(61,220,255,.28);background:rgba(61,220,255,.08);
  color:var(--cyan);font:inherit;font-size:12.5px;font-weight:600;padding:5px 11px;border-radius:9px;
  cursor:pointer;white-space:nowrap;flex:none}
.shbtn:hover{background:rgba(61,220,255,.16);border-color:rgba(61,220,255,.45)}
.shbtn[hidden]{display:none}
#shmask{position:fixed;inset:0;z-index:99999;background:rgba(3,7,14,.6);backdrop-filter:blur(6px);
  display:none;align-items:center;justify-content:center;padding:18px}
#shmask.on{display:flex}
.shcard{width:min(600px,94vw);max-height:86vh;overflow:auto;border-radius:16px;padding:20px 22px;
  background:#0c1320;border:1px solid rgba(255,255,255,.12);box-shadow:0 24px 60px rgba(0,0,0,.55);color:var(--ink);
  font-size:14px}
.shcard h3{margin:0 0 6px;font-size:16px;font-weight:800;letter-spacing:.3px;display:flex;align-items:center}
.shcard h3 b{flex:1}
.shx{appearance:none;border:0;background:transparent;color:var(--ink3);font-size:20px;line-height:1;cursor:pointer;padding:0 2px}
.shx:hover{color:var(--ink)}
.shsub{font-size:12.5px;color:var(--ink2);line-height:1.75;margin-bottom:14px}
.shrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.shrow input,.shrow select{background:rgba(255,255,255,.05);color:var(--ink);border:1px solid var(--line);
  border-radius:9px;padding:8px 10px;font:inherit;font-size:13px;outline:none}
.shrow input:focus,.shrow select:focus{border-color:rgba(61,220,255,.55)}
.shgo{appearance:none;border:0;border-radius:9px;padding:9px 16px;font:inherit;font-size:13px;font-weight:700;
  color:#04121c;background:linear-gradient(96deg,var(--cyan),var(--violet));cursor:pointer}
.shlist{margin-top:14px;border-top:1px solid var(--line2)}
.shitem{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line2);font-size:12.5px}
.shitem code{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink2)}
.shitem .st{color:var(--ink3);white-space:nowrap}
.shitem button{appearance:none;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--ink2);
  font:inherit;font-size:12px;padding:3px 8px;border-radius:7px;cursor:pointer;white-space:nowrap}
.shitem button:hover{color:var(--ink);border-color:rgba(255,255,255,.25)}
.shmsg{margin-top:10px;font-size:12.5px;color:var(--cyan);min-height:18px;word-break:break-all}
/* ---- 自适应：宽屏铺满，窄屏减负，不撑宽文档 ---- */
@media (max-width:1180px){
  .topbar{gap:12px;padding:0 14px}
  .ctx #ctxDate,.ctx #ctxTid,.ctx i{display:none}
  .live{padding:4px 10px}
}
@media (max-width:820px){
  :root{--bar-h:88px}
  .topbar{height:auto;min-height:44px;flex-wrap:wrap;gap:8px 10px;padding:7px 12px 8px}
  .ctx{display:none}
  .brand{font-size:14px}
  .brand span{display:none}
  nav{order:3;flex:1 1 100%;min-width:0;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  nav::-webkit-scrollbar{display:none}
  nav button{flex:none;padding:5px 10px;font-size:13px}
  .shift-chip{font-size:11.5px;padding:3px 8px}
  .live{font-size:11.5px;padding:3px 9px;gap:5px;min-width:0;max-width:58vw;overflow:hidden}
  .live span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
  .subbar{padding:0 12px}
  .subbar.open{padding:0 12px}
}
@media (max-width:520px){
  .brand{font-size:13.5px}
  nav button{font-size:12.5px;padding:5px 8px}
  .shift-chip{display:none}
}
</style></head>
<body>
<div class="topbar">
  <div class="brand">配送台<span>DISPATCH DESK</span></div>
  <nav id="nav">
    <button data-view="today" class="on">今日</button>
    <button data-view="board">实时看板</button>
    <button data-view="kpi">质量目标</button>
  </nav>
  <div class="spacer"></div>
  <div class="ctx" id="ctx">
    <span id="ctxSite">—</span><i>·</i><span id="ctxDate">—</span>
    <i>·</i><span id="ctxTid">—</span>
  </div>
  <div class="shift-chip" id="ctxShift">—</div>
  <button class="shbtn" id="shBtn" hidden onclick="shOpen()" title="生成只读预览链接给别人看">🔗 预览链接</button>
  <div class="live"><i class="dot"></i><span id="liveTxt">数据 —</span></div>
</div>

<div class="subbar" id="subbar"></div>
<div class="stage"><iframe id="frame" src="dash-c2.html?v=20261105b" title="内容区"></iframe></div>


<div id="shmask">
  <div class="shcard">
    <h3><b>🔗 分享预览链接</b><button class="shx" onclick="shClose()">×</button></h3>
    <div class="shsub">发给别人看用：对方只能看，不能改、不能下载报表；页面是混淆版、底部带水印，到期自动失效。<b>别把看板密码直接给人。</b></div>
    <div class="shrow">
      <input id="shNote" placeholder="给谁看（写在水印上）" style="width:170px" maxlength="20">
      <select id="shHours">
        <option value="24">24 小时</option>
        <option value="72">3 天</option>
        <option value="168">7 天</option>
        <option value="0">永久</option>
      </select>
      <button class="shgo" onclick="shNew()">生成链接</button>
    </div>
    <div class="shmsg" id="shMsg"></div>
    <div class="shlist" id="shList"></div>
  </div>
</div>
<script>
var SUB={
  board:[["day","全天达成"],["spike","尖峰天贡献"],["shift","时段达成"],["level","档位达成"],["punctual","准时率"],
         ["qc","橙色风暴抽检"],["appeal","不满意单明细"],["service","服务质量KPI"],["special","订单识别"]]
};
var VIEW='today', SUBKEY={board:'day'};
var frame=document.getElementById('frame'), subbar=document.getElementById('subbar');

function fitChrome(){
  var tb=document.querySelector('.topbar');
  if(!tb) return;
  var h=Math.round(tb.getBoundingClientRect().height);
  document.documentElement.style.setProperty('--bar-h',h+'px');
}
window.addEventListener('resize',function(){ clearTimeout(window.__fct); window.__fct=setTimeout(fitChrome,120); });

function renderSub(){
  var list=SUB[VIEW];
  if(!list){ subbar.className='subbar'; subbar.innerHTML=''; document.body.classList.remove('sub-open'); return; }
  subbar.className='subbar open'; document.body.classList.add('sub-open');
  subbar.innerHTML=list.map(function(kv){
    var on=SUBKEY[VIEW]===kv[0]?' on':'';
    return '<button class="'+on.trim()+'" data-k="'+kv[0]+'">'+kv[1]+'</button>';
  }).join('');
  subbar.querySelectorAll('button').forEach(function(b){
    b.onclick=function(){ SUBKEY[VIEW]=b.dataset.k; renderSub(); applyView(); };
  });
  fitChrome();
}

function d(){ try{ return frame.contentWindow.document; }catch(e){ return null; } }

function darken(){
  var doc=d(); if(!doc) return;
  try{
    doc.documentElement.setAttribute('data-theme','dark');
    if(doc.body) doc.body.setAttribute('data-theme','dark');
    if(frame.contentWindow.applyTheme) frame.contentWindow.applyTheme('dark');
  }catch(e){}
}

function splitBoard(tab){
  var doc=d(); if(!doc) return;
  var st=doc.getElementById('c2-split');
  if(!st){ st=doc.createElement('style'); st.id='c2-split'; st.textContent=
    '.titlebar{display:none!important}.site-hd{display:none!important}.tabs{display:none!important}';
    (doc.head||doc.documentElement).appendChild(st); }
  var b=doc.querySelector('.tab[data-tab="'+tab+'"]');
  if(b) b.click();
}

/* 统一令牌：让三个 iframe 的字号/圆角/字体跟外壳一套 */
function unify(){
  var doc=d(); if(!doc) return;
  var st=doc.getElementById('c2-unify');
  if(!st){ st=doc.createElement('style'); st.id='c2-unify';
    st.textContent=[
      'html,body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif !important}',
      'body{font-size:14px !important}',
      '.card,.kpicard,.gapcard,section,.stat{border-radius:14px !important}',
      '.card,.kpicard,.gapcard,section{background:rgba(255,255,255,.045) !important;border-color:rgba(255,255,255,.10) !important}'
    ].join('\n');
    (doc.head||doc.documentElement).appendChild(st);
  }
}

/* 把当前页的上下文回填到外壳顶栏（iframe 里不再重复显示） */
function fillCtx(){
  var doc=d(); if(!doc) return;
  var t=function(s){var e=doc.querySelector(s);return e?e.textContent.trim():'';};
  var site=t('#site')||t('.site-name')||t('h1');
  var meta=t('#identMeta');
  var date=(meta.match(/(\d{4}-\d{2}-\d{2})/)||[])[1]||(t('.dt-badge').match(/(\d{4}-\d{2}-\d{2})/)||[])[1]||'';
  var tid=(meta.match(/TID\s*(\d+)/)||[])[1]||'';
  var live=t('#liveTxt')||t('.dt-badge');
  document.getElementById('ctxSite').textContent=site||'—';
  document.getElementById('ctxDate').textContent=date||'—';
  document.getElementById('ctxTid').textContent=tid?('TID '+tid):'—';
  document.getElementById('ctxShift').textContent=t('#curShift')||t('.site-hd .meta2')||'—';
  var lt=live?live.replace(/^.*?数据/,'数据'):'';
  if(!lt||/数据\s*—/.test(lt)){
    var dtb=doc.querySelector('.dt-badge')||doc.querySelector('#safcd');
    var dtxt=dtb?dtb.textContent.replace(/\s+/g,' ').trim():'';
    lt=dtxt?dtxt.slice(0,26):(VIEW==='today'?'数据 —':'看板 60 秒自动刷新');
  }
  document.getElementById('liveTxt').textContent=lt;
}

function applyView(){
  if(VIEW==='board') splitBoard(SUBKEY.board);
  darken(); unify(); fillCtx();
}

function go(view){
  VIEW=view;
  document.querySelectorAll('#nav button').forEach(function(b){ b.classList.toggle('on',b.dataset.view===view); });
  renderSub();
  if(view==='today'){ frame.src='dash-c2.html?embed=1&v=20261105b'; return; }
  if(view==='kpi'){ frame.src='kpi-c2.html'; return; }
  if(view==='board'){ frame.src='index.html?embed=1'; return; }
}

document.querySelectorAll('#nav button').forEach(function(b){
  if(b.disabled) return;
  b.onclick=function(){ go(b.dataset.view); };
});

frame.onload=function(){ setTimeout(applyView, 400); };
renderSub();
fitChrome();
if(window.ResizeObserver){ new ResizeObserver(fitChrome).observe(document.querySelector('.topbar')); }
go('today');

/* ---- 预览链接：只读 / 限时 / 带水印（2026-11-19）---- */
var SHBASE='';
function shEl(id){return document.getElementById(id);}
function shOpen(){ var m=shEl('shmask'); if(!m) return; m.classList.add('on'); shList(); }
function shClose(){ var m=shEl('shmask'); if(m) m.classList.remove('on'); }
function shList(){
  shEl('shList').innerHTML='<div class="shmsg">读取中…</div>';
  fetch('/api/share',{cache:'no-store'}).then(function(r){return r.json();}).then(function(d){
    if(!d||!d.ok){ shEl('shList').innerHTML='<div class="shmsg" style="color:#ff4d8d">读取失败</div>'; return; }
    SHBASE=d.base||location.origin;
    var rows=(d.links||[]).map(function(x){
      var u=SHBASE+'/s/'+x.token;
      return '<div class="shitem"><code title="'+u+'">'+u+'</code>'
        +'<span class="st">'+(x.alive?('至 '+x.expire):'已过期')+'</span>'
        +'<button onclick="shCopy(\''+x.token+'\')">复制</button>'
        +'<button onclick="shRevoke(\''+x.token+'\')">撤销</button></div>';
    }).join('');
    var warn = d.base ? '' : '<div class="shmsg" style="color:#ffa53d">⚠️ 未配置公网地址：'
      +'把对外地址写进 <code>data/share_base.txt</code>（如 frp 域名），否则链接只能在本机打开。</div>';
    shEl('shList').innerHTML=warn+(rows||'<div class="shmsg" style="color:var(--ink3)">还没有生成过链接</div>');
  }).catch(function(){ shEl('shList').innerHTML='<div class="shmsg" style="color:#ff4d8d">网络错误</div>'; });
}
function shNew(){
  var note=(shEl('shNote').value||'').trim(), hours=shEl('shHours').value;
  shEl('shMsg').textContent='生成中…';
  fetch('/api/share',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({action:'new',hours:parseFloat(hours),note:note})})
   .then(function(r){return r.json();}).then(function(d){
     if(!d||!d.ok){ shEl('shMsg').textContent='生成失败：'+((d&&d.err)||''); return; }
     shEl('shMsg').textContent='已生成（有效至 '+d.expire+'）：'+d.url;
     if(d.base) SHBASE=d.base;
     shList();
   }).catch(function(){ shEl('shMsg').textContent='网络错误'; });
}
function shCopy(tk){
  var url=SHBASE+'/s/'+tk, ok=function(){ shEl('shMsg').textContent='已复制：'+url; };
  try{ navigator.clipboard.writeText(url).then(ok,ok); }catch(e){ ok(); }
}
function shRevoke(tk){
  fetch('/api/share',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({action:'revoke',token:tk})})
   .then(function(){ shEl('shMsg').textContent='已撤销'; shList(); });
}
(function(){
  if(location.protocol==='file:') return;
  fetch('/api/share',{method:'GET',cache:'no-store'}).then(function(r){return r.json();})
    .then(function(d){ if(d&&d.ok){ var b=shEl('shBtn'); if(b) b.hidden=false; } }).catch(function(){});
})();
</script>
</body></html>
