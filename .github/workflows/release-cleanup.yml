name: release-cleanup

# 一次性清理：删掉包名被吞成 "-Windows.zip" 的错误 release（win-v1.0.0）及其 tag
on:
  push:
    tags:
      - 'cleanup-*'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET: win-v1.0.0
    steps:
      - name: 删除 release 与 tag
        run: |
          gh release delete "$TARGET" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$TARGET" || true
          echo "剩余 release："
          gh release list --repo "$GITHUB_REPOSITORY"
